services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: resumebuddy
      POSTGRES_USER: resumebuddy
      POSTGRES_PASSWORD: resumebuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumebuddy -d resumebuddy"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  resumebuddy:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://resumebuddy:resumebuddy@postgres:5432/resumebuddy
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/outputs:/app/backend/outputs
    restart: unless-stopped

volumes:
  postgres_data:
